services:
  api:
    build: .
    container_name: smartticket-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs

  worker:
    build: .
    container_name: smartticket-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs