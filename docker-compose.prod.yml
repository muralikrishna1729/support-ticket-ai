services:
  api:
    build: .
    container_name: smartticket-api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: smartticket-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs

  frontend:
    build: .
    container_name: smartticket-frontend
    restart: unless-stopped
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    expose:
      - "8501"
    env_file:
      - .env
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: smartticket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend