name: CI/CD Pipeline

on:
  push:
    branches:
      - main    # triggers on every push to main
  pull_request:
    branches:
      - main    # triggers on pull requests to main

jobs:
  test: 
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.prod.txt

      # Step 4: Run tests
      - name: Run tests
        env:
          TESTING: "true"
          DATABASE_URL: sqlite:///./test.db
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-south-1
          SQS_QUEUE_URL: https://sqs.ap-south-1.amazonaws.com/test/test
          S3_BUCKET_NAME: test-bucket
          SES_SENDER_EMAIL: test@test.com
          SES_RECEIVER_EMAIL: test@test.com
        run: |
          pytest tests/ -v --tb=short
      - name: Check code passed
        run: echo "✅ All tests passed successfully!"

  # ── JOB 2: CD — Deploy to EC2 (only if tests pass) ────────────

        
    
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Deploy to EC2 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host     : ${{ secrets.EC2_HOST }}
          username : ${{ secrets.EC2_USERNAME }}
          key      : ${{ secrets.EC2_SSH_KEY }}
          script   : |
            cd ~/support-ticket-ai

            # Pull latest code
            git pull origin main

            # Rebuild and restart containers
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d

            # Verify health
            sleep 15
            curl -f http://localhost/api/health